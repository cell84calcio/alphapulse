name: Aggiornamento Automatico Dati Borsa

on:
  schedule:
    # 1. Apertura Europa: 08:30 UTC (09:30 CET - Prezzi live apertura Milano/Francoforte/Parigi)
    - cron: '30 8 * * 1-5'
    # 2. Mattinata Europa: 10:30 UTC (11:30 CET - Aggiornamento intraday mercati europei)
    - cron: '30 10 * * 1-5'
    # 3. Pomeriggio / Pre-Wall Street: 13:45 UTC (14:45 CET - Apertura borsa americana)
    - cron: '45 13 * * 1-5'
    # 4. Chiusura Europa / Metà seduta USA: 16:45 UTC (17:45 CET - Chiusura Piazza Affari)
    - cron: '45 16 * * 1-5'
    # 5. Chiusura Wall Street: 21:30 UTC (22:30 CET - Chiusura mercati USA)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Permette anche di avviarlo manualmente con un pulsante su GitHub

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esegui Scansione Dati Reali & News
        run: |
          python3 server.py --update-only

      - name: Commit e Push dei Dati Aggiornati
        run: |
          git config --global user.name "AlphaPulse Bot"
          git config --global user.email "bot@alphapulse.local"
          git add market_data.json history_ledger.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Dati reali di borsa del $(date +'%Y-%m-%d %H:%M')" && git push)
