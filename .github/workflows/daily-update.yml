name: Aggiornamento Automatico Dati Borsa

on:
  schedule:
    # Aggiornamento automatico ogni 30 minuti dalle 09:00 alle 24:00 (Lunedì - Venerdì)
    # Range 07:00 - 23:00 UTC (ogni 30 min):
    # - In orario invernale (CET = UTC+1): copre dalle 08:00 alle 24:00 CET
    # - In orario estivo (CEST = UTC+2): copre dalle 09:00 alle 01:00 CEST
    - cron: '0,30 7-23 * * 1-5'
  workflow_dispatch: # Permette anche di avviarlo manualmente con un pulsante su GitHub

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esegui Scansione Dati Reali & News
        run: |
          python3 server.py --update-only

      - name: Commit e Push dei Dati Aggiornati
        run: |
          git config --global user.name "AlphaPulse Bot"
          git config --global user.email "bot@alphapulse.local"
          git add market_data.json history_ledger.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Dati reali di borsa del $(date +'%Y-%m-%d %H:%M')" && git pull --rebase && git push)
